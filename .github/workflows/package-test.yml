name: Pardus 25 paket testi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: debian:13-slim

    steps:
      - name: Test araçlarını kur
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git nodejs python3 dpkg-dev zip

      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Paketi oluştur ve statik testleri çalıştır
        run: |
          chmod +x scripts/build-deb.sh tests/test-package.sh
          ./scripts/build-deb.sh
          ./tests/test-package.sh

      - name: Temiz sistem bağımlılık çözümünü doğrula
        run: apt-get --simulate install ./dist/pardus-yansit_0.1.0_all.deb

      - name: Paketi iş akışı çıktısı olarak ekle
        uses: actions/upload-artifact@v4
        with:
          name: pardus-yansit-0.1.0
          path: dist/pardus-yansit_0.1.0_all.deb
          if-no-files-found: error
